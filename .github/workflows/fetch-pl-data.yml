# Pulls Premier League player birthplaces from Wikipedia + Wikidata, adds PL appearances
# from the premierleague.com stats feed, and commits
# footballers-map/data/players.json back to the branch it ran on.
name: Fetch PL birthplace data

on:
  workflow_dispatch:
  push:
    branches-ignore: ["main"]
    paths:
      - "scripts/fetch_pl_players.py"
      - "scripts/fetch_pl_appearances.py"
      - ".github/workflows/fetch-pl-data.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python3 scripts/fetch_pl_players.py
      - name: Add PL appearances
        run: python3 scripts/fetch_pl_appearances.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add footballers-map/data/players.json footballers-map/data/gaps.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Premier League birthplace data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
